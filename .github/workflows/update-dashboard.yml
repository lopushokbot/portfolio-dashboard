name: Update APY Dashboard

on:
  schedule:
    # 9:00 AM Dubai time (UTC+4) = 5:00 AM UTC
    - cron: '0 5 * * *'
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths:
      - apy_dashboard.html

permissions:
  contents: write

# Never run two updates at once (a push + manual trigger raced on 2026-10-20 and one push was rejected)
concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Memory of the new-protocol scanner (last scanned block + tokens seen per chain). Kept in the
      # Actions cache, not the repo; if it's ever evicted the scanner just looks back a few days again.
      - name: Restore position-scanner state
        uses: actions/cache@v4
        with:
          path: .positions-state.json
          key: positions-state-${{ github.run_id }}
          restore-keys: positions-state-

      - name: Generate and validate dashboard
        env:
          # Tracked wallet addresses (comma-separated). Secret: never in the repo, on the page or in logs.
          APY_WALLETS: ${{ secrets.APY_WALLETS }}
          POSITIONS_STATE: .positions-state.json
        run: |
          for attempt in 1 2 3; do
            echo "=== Attempt $attempt of 3 ==="
            python3 scripts/generate_dashboard.py

            # Validate core protocol sections have data (9 protocols total)
            result=$(python3 -c "
          import sys
          html = open('apy_dashboard.html').read()
          def section_ok(marker, bad='No data'):
              parts = html.split(marker)
              return len(parts) > 1 and bad not in parts[1].split('</section>')[0] and 'error-msg' not in parts[1].split('</section>')[0]
          sections = {
              'Fluid':  'Ethereum' in html and 'Arbitrum' in html,
              'Morpho': section_ok('</span> Morpho &mdash;'),
              'Maple':  section_ok('</span> Maple Finance'),
              'Jupiter':'JUPUSD' in html,
              'Ethena': section_ok('</span> sUSDe (Ethena)'),
              'Sky':    section_ok('</span> sUSDS (Sky)'),
              'HLP':    section_ok('</span> Hyperliquid HLP Vault'),
              'Aave':   section_ok('</span> Aave V3 &mdash;'),
          }
          # My Positions: warn but don't block (a single protocol API hiccup shouldn't hold the page)
          if '</span> My Positions' not in html:
              print('NOTE: My Positions card missing (APY_WALLETS secret not set?)', file=sys.stderr)
          elif 'error-msg' in html.split('</span> My Positions')[1].split('</section>')[0]:
              print('NOTE: My Positions has unreachable sources today', file=sys.stderr)
          # Falcon API is frequently unavailable; warn but don't block
          if 'sUSDf APY' not in html:
              print('NOTE: Falcon sUSDf APY missing (API may be down — not blocking)', file=sys.stderr)
          failed = [k for k, v in sections.items() if not v]
          if failed:
              print(f'MISSING: {chr(44).join(failed)}')
          else:
              print('OK')
          ")

            if [ "$result" = "OK" ]; then
              echo "✓ All 9 core sections validated"
              break
            else
              echo "✗ $result"
              if [ "$attempt" -lt 3 ]; then
                echo "Waiting 30s before retry..."
                sleep 30
              else
                echo "All 3 attempts failed. Pushing best available data."
              fi
            fi
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apy_dashboard.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update APY dashboard — $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
